            const icon = refreshBtn.querySelector('.fas');
            
            // Disable button and show loading state
            refreshBtn.disabled = true;
            if (icon) {
                icon.classList.add('fa-spin');
            }
            
            try {
                // Get session ID from localStorage
                const sessionId = localStorage.getItem('last_session_id');
                if (!sessionId) {
                    alert('没有找到会话ID，请先生成模型');
                    return;
                }
                
                // Fetch session files from API
                const response = await fetch(`/api/session/${sessionId}`);
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                // Clear all existing results and container
                resultFiles = { images: [], models: [] };
                const display = document.getElementById('result-display');
                display.innerHTML = '';
                if (currentModelViewer) {
                    try {
                        currentModelViewer.destroy();
                    } catch (e) {
                        console.warn('Error destroying viewer:', e);
                    }
                    currentModelViewer = null;
                }
                
                // Add found files to results
                if (data.files && data.files.length > 0) {
                    data.files.forEach(file => {
                        const url = `/api/file/${file.path}`;
                        // Add to resultFiles without updating UI
                        if (file.type === 'model') {
                            resultFiles.models.push({ url, label: file.label });
                        } else {
                            resultFiles.images.push({ url, label: file.label });
                        }
                    });
                    
                    // Manually build navigation and display the last file
                    const lastFile = data.files[data.files.length - 1];
                    const nav = document.getElementById('result-nav');
                    let html = '';
                    
                    // Add image buttons
                    resultFiles.images.forEach((img, index) => {
                        html += `
                            <button class="nav-btn image-btn" onclick="showResult('image-${index}')">
                                <img src="${img.url}" alt="${img.label}">
                                <span style="font-size: 12px;">${img.label}</span>
                            </button>
                        `;
                    });
                    
                    // Add model buttons
                    resultFiles.models.forEach((model, index) => {
                        html += `
                            <button class="nav-btn model-btn" onclick="showResult('model-${index}')">
                                ${model.label}
                            </button>
                        `;
                    });
                    
                    nav.innerHTML = html;
                    
                    // Display the last file and activate its button
                    displayResult(lastFile.type, lastFile.type === 'model' ? resultFiles.models.length - 1 : resultFiles.images.length - 1);
                    
                    if (lastFile.type === 'image') {
                        const buttonIndex = resultFiles.images.length - 1;
                        if (nav.children[buttonIndex]) {
                            nav.children[buttonIndex].classList.add('active');
                        }
                    } else {
                        const buttonIndex = resultFiles.images.length + resultFiles.models.length - 1;
                        if (nav.children[buttonIndex]) {
                            nav.children[buttonIndex].classList.add('active');
                        }
                    }
                    
                    // Show success message
                    console.log(`Loaded ${data.files.length} files for session ${sessionId}`);
                } else {
                    console.log('No files found for session', sessionId);
                }
                
            } catch (error) {
                console.error('Error refreshing session files:', error);
                alert(`刷新失败：${error.message}`);
            } finally {
                // Restore button state
                refreshBtn.disabled = false;
                if (icon) {
                    icon.classList.remove('fa-spin');
                }
            }
        }

        // Upload file handling
        let uploadedModelFile = null;
        const modelFileInput = document.getElementById('model-file-input');
        const modelUploadArea = document.getElementById('model-upload-area');

        // Initialize upload area when tab is shown
        function initializeUploadArea() {
            // Click to upload
            modelUploadArea.addEventListener('click', () => {
                modelFileInput.click();
            });

            // Drag and drop
            modelUploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                modelUploadArea.style.borderColor = 'var(--primary-color)';
                modelUploadArea.style.background = 'rgba(102, 126, 234, 0.05)';
            });

            modelUploadArea.addEventListener('dragleave', () => {
                modelUploadArea.style.borderColor = 'var(--border-color)';
                modelUploadArea.style.background = 'var(--background-color)';
            });

            modelUploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                modelUploadArea.style.borderColor = 'var(--border-color)';
                modelUploadArea.style.background = 'var(--background-color)';
                
                const files = Array.from(e.dataTransfer.files).filter(f => 
                    f.name.endsWith('.glb') || f.name.endsWith('.gltf') || f.name.endsWith('.obj')
                );
                if (files.length > 0) {
                    handleModelFile(files[0]);
                } else {
                    alert('请上传GLB、GLTF或OBJ格式的3D模型文件');
                }
            });
        }

        // Handle file input change
        modelFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                handleModelFile(file);
            }
        });

        // Handle model file
        function handleModelFile(file) {
            uploadedModelFile = file;
            updateModelUploadPreview(file);
            // Display the uploaded file in the result area
            displayUploadedFile(file);
        }

        // Display uploaded file in result area
        function displayUploadedFile(file) {
            // Create object URL for the file
            const fileUrl = URL.createObjectURL(file);
            
            // Check if we already have this file displayed (avoid duplicates)
            const existingIndex = resultFiles.models.findIndex(m => m.label === file.name);
            
            if (existingIndex === -1) {
                // Add new file to results
                resultFiles.models.push({ 
                    url: fileUrl, 
                    label: file.name 
                });
                const lastIndex = resultFiles.models.length - 1;
                updateResultNav('model', lastIndex);
            } else {
                // File already exists, just show it
                displayResult('model', existingIndex);
                // Update active button
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                const buttonIndex = resultFiles.images.length + existingIndex;
                const nav = document.getElementById('result-nav');
                if (nav.children[buttonIndex]) {
                    nav.children[buttonIndex].classList.add('active');
                }
            }
        }

        // Update upload area with file info
        function updateModelUploadPreview(file) {
            const statusMsg = document.getElementById('upload-status-message');
            statusMsg.textContent = `已选择文件：${file.name}`;
            statusMsg.className = 'status-message show';
            statusMsg.style.backgroundColor = 'rgba(40, 167, 69, 0.2)';
            statusMsg.style.color = '#155724';
            
            modelUploadArea.classList.add('has-content');
            modelUploadArea.style.position = 'relative';
            modelUploadArea.innerHTML = `
                <div style="padding: 20px; position: relative; width: 100%; height: 100%;">
                    <button class="delete-btn" onclick="removeModelFile()" style="position: absolute; top: 10px; right: 10px;">
                        <i class="fas fa-times"></i>
                    </button>
                    <div style="text-align: center; margin-bottom: 15px;">
                        <i class="fas fa-check-circle" style="font-size: 3rem; color: #28a745;"></i>
                    </div>
                    <p style="text-align: center; font-weight: 600; margin-bottom: 10px;">${file.name}</p>
                    <p style="text-align: center; font-size: 12px; color: #8d99ae;">文件大小: ${(file.size / 1024 / 1024).toFixed(2)} MB</p>
                </div>
            `;
        }

        // Remove uploaded file
        function removeModelFile() {
            // Remove from result files if exists
            if (uploadedModelFile) {
                const fileIndex = resultFiles.models.findIndex(m => m.label === uploadedModelFile.name);
                if (fileIndex !== -1) {
                    // Revoke the object URL to free memory
                    URL.revokeObjectURL(resultFiles.models[fileIndex].url);
                    // Remove from array
                    resultFiles.models.splice(fileIndex, 1);
                    // Update navigation
                    updateResultNav();
                    // Show appropriate content
                    if (resultFiles.models.length > 0) {
                        displayResult('model', 0);
                    } else if (resultFiles.images.length > 0) {
                        displayResult('image', 0);
                    } else {
                        displayResult('none', 0);
                    }
                }
            }
            
            uploadedModelFile = null;
            const statusMsg = document.getElementById('upload-status-message');
            statusMsg.className = 'status-message';
            statusMsg.style.display = 'none';
            
            modelUploadArea.classList.remove('has-content');
            modelUploadArea.innerHTML = `
                <div class="upload-placeholder">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>点击或拖拽上传3D模型文件</p>
                    <p style="font-size: 12px; color: #8d99ae; margin-top: 10px;">支持格式：GLB, GLTF, OBJ</p>
                </div>
            `;
            modelFileInput.value = '';
        }

        // Confirm upload function
        async function confirmUpload() {
            // Validate name and file
            const name = document.getElementById('upload-name').value.trim();
            if (!name) {
                alert('请输入名称');
                return;
            }
            
            if (!uploadedModelFile) {
                alert('请先上传3D模型文件');
                return;
            }

            // Get selected category
            const category = document.querySelector('input[name="upload-category"]:checked').value;

            // Disable button and show loading state
            const confirmBtn = document.getElementById('confirm-upload-btn');
            confirmBtn.disabled = true;
            confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 上传中...';

            const statusMsg = document.getElementById('upload-status-message');
            statusMsg.textContent = '正在上传文件...';
            statusMsg.className = 'status-message show';
            statusMsg.style.backgroundColor = 'rgba(0, 123, 255, 0.2)';
            statusMsg.style.color = '#004085';

            try {
                // Generate unique session ID
                const sessionId = generateUUID();
                currentSessionId = sessionId;
                localStorage.setItem('last_session_id', sessionId);
                console.log('Generated session ID:', sessionId);
                console.log('Upload category:', category);

                // Get file extension
                const fileName = uploadedModelFile.name;
                const fileExtension = fileName.substring(fileName.lastIndexOf('.'));
                const uploadFileName = `${sessionId}_textured${fileExtension}`;

                statusMsg.textContent = category === 'scene'
                    ? '正在生成场景俯视渲染图...'
                    : '正在生成模型渲染图...';
                const renderPreviewBlob = await generateUploadRenderPreview(uploadedModelFile, category);

                // Create FormData for file upload
                const formData = new FormData();
                formData.append('file', uploadedModelFile);
                formData.append('name', name);
                formData.append('session_id', sessionId);
                formData.append('filename', uploadFileName);
                formData.append('category', category);
                if (renderPreviewBlob) {
                    formData.append('render_image', renderPreviewBlob, `${sessionId}_render.png`);
                }

                statusMsg.textContent = '正在上传文件...';

                // Upload file to server
                const response = await fetch('/api/main/upload_model', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (result.error) {
                    throw new Error(result.error);
                }

                // Success message
                statusMsg.textContent = '文件上传成功';
                statusMsg.style.backgroundColor = 'rgba(40, 167, 69, 0.2)';
                statusMsg.style.color = '#155724';

                console.log('File uploaded successfully:', result);

                // Add uploaded file to result list
                if (result.file_url) {
                    addResult('model', `/api/file/${result.file_url}`, name);
                }

            } catch (error) {
                console.error('Upload error:', error);
                statusMsg.textContent = `上传失败：${error.message}`;
                statusMsg.style.backgroundColor = 'rgba(220, 53, 69, 0.2)';
                statusMsg.style.color = '#721c24';
            } finally {
                // Restore button
                confirmBtn.disabled = false;
                confirmBtn.innerHTML = '<i class="fas fa-check"></i> 确认上传';
            }
        }

        function dataURLToBlob(dataURL) {
            const parts = dataURL.split(',');
            const mimeMatch = parts[0].match(/:(.*?);/);
            const mime = mimeMatch ? mimeMatch[1] : 'image/png';
            const byteString = atob(parts[1]);
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], { type: mime });
        }

        async function generateUploadRenderPreview(file, category) {
            const objectUrl = URL.createObjectURL(file);
            const previewScene = new THREE.Scene();
            previewScene.background = new THREE.Color(0xf6f6f6);

            const previewCamera = new THREE.PerspectiveCamera(45, 4 / 3, 0.1, 1000);
            const previewRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
            previewRenderer.setSize(800, 600);
            previewRenderer.setPixelRatio(window.devicePixelRatio || 1);
            previewRenderer.outputEncoding = THREE.sRGBEncoding;
            previewRenderer.toneMapping = THREE.ACESFilmicToneMapping;
            previewRenderer.toneMappingExposure = 1.4;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.1);
            mainLight.position.set(3, 4, 5);
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
            fillLight.position.set(-3, 2, -4);
            const topLight = new THREE.DirectionalLight(0xffffff, 0.9);
            topLight.position.set(0, 6, 0);
            previewScene.add(ambientLight, mainLight, fillLight, topLight);

            const ext = file.name.split('.').pop().toLowerCase();

            try {
                const object3D = await new Promise((resolve, reject) => {
                    if (ext === 'obj') {
                        const objLoader = new THREE.OBJLoader();
                        objLoader.load(objectUrl, resolve, undefined, reject);
                    } else {
                        const gltfLoader = new THREE.GLTFLoader();
                        gltfLoader.load(objectUrl, (gltf) => resolve(gltf.scene), undefined, reject);
                    }
                });

                previewScene.add(object3D);

                const box = new THREE.Box3().setFromObject(object3D);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z, 1e-3);

                object3D.position.sub(center);
                const target = new THREE.Vector3(0, 0, 0);

                if (category === 'scene') {
                    // 场景使用俯视图
                    previewCamera.position.set(0.001, maxDim * 2.2, 0.001);
                    previewCamera.up.set(0, 0, -1);
                } else {
                    previewCamera.position.set(maxDim * 1.4, maxDim * 1.2, maxDim * 1.4);
                    previewCamera.up.set(0, 1, 0);
                }
                previewCamera.lookAt(target);
                previewCamera.updateProjectionMatrix();

                previewRenderer.render(previewScene, previewCamera);
                const dataUrl = previewRenderer.domElement.toDataURL('image/png');
                return dataURLToBlob(dataUrl);
            } catch (error) {
                console.warn('生成上传渲染图失败，继续上传模型:', error);
                return null;
            } finally {
                URL.revokeObjectURL(objectUrl);
                previewRenderer.dispose();
            }
        }

    </script>
