<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D模型AR展示</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3a0ca3;
            --accent-color: #7209b7;
            --success-color: #4cc9f0;
            --background-color: #f8f9fa;
            --card-background: #ffffff;
            --text-primary: #2b2d42;
            --text-secondary: #8d99ae;
            --border-color: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }

        header {
            margin-bottom: 30px;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            display: inline-block;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #f0f0f0; /* 灰白色 */
            max-width: 600px;
            margin: 0 auto 20px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .model-container {
            width: 100%;
            height: 500px;
            margin: 20px 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            background: var(--card-background);
            border: 1px solid var(--border-color);
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --progress-bar-color: var(--primary-color);
        }

        .instructions {
            background: var(--card-background);
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: left;
            border: 1px solid var(--border-color);
        }

        .instructions h2 {
            color: var(--text-primary);
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
            font-size: 1.8rem;
        }

        .instructions h2::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 80px;
            height: 3px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            border-radius: 2px;
        }

        .instructions ol {
            padding-left: 20px;
            margin-bottom: 15px;
        }

        .instructions li {
            margin-bottom: 10px;
            line-height: 1.5;
            color: var(--text-secondary);
        }

        .feature-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .feature {
            background: var(--card-background);
            border-radius: 10px;
            padding: 20px;
            width: 200px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .feature:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .model-selector {
            margin: 20px 0;
            padding: 12px 16px;
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            font-size: 16px;
            background-color: var(--card-background);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .model-selector:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .loading {
            display: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin: 10px 0;
        }

        .error-message {
            display: none;
            color: #e74c3c;
            background: #ffeaea;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #ffcdd2;
        }

        @media (max-width: 768px) {
            .model-container {
                height: 400px;
            }

            h1 {
                font-size: 2rem;
            }
        }

        .back-btn {
            padding: 12px 24px;
            background: var(--card-background);
            border: 2px solid var(--primary-color);
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            color: var(--primary-color);
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            background: var(--primary-color);
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div style="display: flex; align-items: center; gap: 20px; justify-content: center;">
            <button id="back-button" class="back-btn">
                <i class="fas fa-arrow-left"></i> 返回
            </button>
            <h1>3D模型AR展示</h1>
        </div>
        <p class="subtitle">在Safari浏览器中查看3D模型的增强现实体验</p>
    </header>

    <select id="modelSelector" class="model-selector">
        <option value="">-- 请选择3D模型 --</option>
    </select>

    <div id="loadingMessage" class="loading">
        <i class="fas fa-spinner fa-spin"></i> 加载中...
    </div>

    <div id="errorMessage" class="error-message"></div>

    <div class="model-container">
        <model-viewer
                id="modelViewer"
                ar
                ar-modes="scene-viewer quick-look"
                camera-controls
                auto-rotate
                shadow-intensity="1"
                alt="3D模型展示">
            <button slot="ar-button"
                    style="background-color: white; border-radius: 4px; border: none; position: absolute; bottom: 16px; right: 16px; padding: 8px 16px;">
                在AR中查看
            </button>
        </model-viewer>
    </div>

    <div class="instructions">
        <h2>使用说明</h2>
        <ol>
            <li>从下拉菜单中选择要查看的3D模型</li>
            <li>使用触摸屏旋转、缩放和移动模型</li>
            <li>点击右下角的"在AR中查看"按钮，在增强现实环境中查看模型（需要iOS设备）</li>
            <li>在AR模式下，移动设备以在真实环境中放置模型</li>
        </ol>
        <p><strong>注意：</strong>
        <ul>
            <li>AR功能需要iOS 12+和Safari浏览器</li>
            <li>某些复杂模型可能需要更长的加载时间</li>
        </ul>
        </p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const modelViewer = document.getElementById('modelViewer');
        const modelSelector = document.getElementById('modelSelector');
        const loadingMessage = document.getElementById('loadingMessage');
        const errorMessage = document.getElementById('errorMessage');

        // 显示加载状态
        function showLoading() {
            loadingMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        // 隐藏加载状态
        function hideLoading() {
            loadingMessage.style.display = 'none';
        }

        // 显示错误信息
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            loadingMessage.style.display = 'none';
        }

        // 从服务器获取模型列表
        showLoading();
        fetch('/api/database/models')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('获取模型列表失败: ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    hideLoading();
                    if (data.status === 'success' && data.models) {
                        // 清空现有选项（除了第一个）
                        while (modelSelector.children.length > 1) {
                            modelSelector.removeChild(modelSelector.lastChild);
                        }

                        // 添加模型选项
                        data.models.forEach(model => {
                            const option = document.createElement('option');
                            option.value = model.file_url; // 使用file_url作为值
                            option.textContent = model.name || `模型-${model.session_id}`;
                            option.dataset.sessionId = model.session_id;
                            option.dataset.category = model.category;
                            modelSelector.appendChild(option);
                        });

                        if (data.models.length === 0) {
                            showError('暂无可用模型，请先上传或生成模型');
                        }
                    } else {
                        showError('获取模型列表失败: ' + (data.message || '未知错误'));
                    }
                })
                .catch(error => {
                    hideLoading();
                    showError('获取模型列表失败: ' + error.message);
                    console.error('获取模型列表失败:', error);
                });

        // 当选择模型时更新viewer
        modelSelector.addEventListener('change', function () {
            const selectedOption = this.options[this.selectedIndex];
            const fileUrl = this.value;
            const sessionId = selectedOption.dataset.sessionId;

            if (fileUrl && sessionId) {
                showLoading();

                // 首先尝试获取会话文件列表，找到正确的模型文件
                fetch(`/api/session/${sessionId}`)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error('获取会话文件失败: ' + response.status);
                            }
                            return response.json();
                        })
                        .then(sessionData => {
                            hideLoading();

                            if (sessionData.files && sessionData.files.length > 0) {
                                // 优先寻找带纹理的模型文件
                                let modelFile = sessionData.files.find(file =>
                                        file.filename.includes('_textured.') &&
                                        (file.filename.endsWith('.glb') || file.filename.endsWith('.gltf'))
                                );

                                // 如果没有带纹理的，找白模
                                if (!modelFile) {
                                    modelFile = sessionData.files.find(file =>
                                            file.filename.includes('_white.') &&
                                            (file.filename.endsWith('.glb') || file.filename.endsWith('.gltf'))
                                    );
                                }

                                // 如果还没有，使用第一个glb/gltf文件
                                if (!modelFile) {
                                    modelFile = sessionData.files.find(file =>
                                            file.filename.endsWith('.glb') || file.filename.endsWith('.gltf')
                                    );
                                }

                                if (modelFile) {
                                    // 使用统一的文件下载接口
                                    modelViewer.src = `/api/file/${modelFile.filename}`;
                                    errorMessage.style.display = 'none';
                                } else {
                                    showError('该会话中没有找到可用的3D模型文件');
                                }
                            } else {
                                showError('该会话没有文件');
                            }
                        })
                        .catch(error => {
                            hideLoading();
                            // 如果获取会话文件失败，直接尝试使用数据库中的file_url
                            modelViewer.src = `/api/file/${fileUrl}`;
                            console.warn('使用备用文件路径:', fileUrl);
                        });
            } else {
                modelViewer.src = '';
                errorMessage.style.display = 'none';
            }
        });

        // 处理模型加载事件
        modelViewer.addEventListener('load', function () {
            hideLoading();
            errorMessage.style.display = 'none';
            console.log('模型加载成功');
        });

        modelViewer.addEventListener('error', function () {
            showError('模型加载失败，请检查文件是否可用');
        });
    });
</script>

<script>
    document.getElementById('back-button').addEventListener('click', function () {
        window.history.back();
    });
</script>
</body>
</html>
